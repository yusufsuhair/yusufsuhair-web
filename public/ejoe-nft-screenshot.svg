<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient matching crypto category -->
  <defs>
    <linearGradient id="cryptoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#cryptoGradient)"/>
  
  <!-- Grid pattern for NFT marketplace feel -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="400" height="250" fill="url(#grid)"/>
  
  <!-- NFT Card Mockup -->
  <rect x="50" y="40" width="120" height="140" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="60" y="50" width="100" height="80" rx="4" fill="rgba(255,255,255,0.1)"/>
  <text x="110" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">NFT Name</text>
  <text x="110" y="160" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="8">0.5 ETH</text>
  
  <!-- Second NFT Card -->
  <rect x="230" y="40" width="120" height="140" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="240" y="50" width="100" height="80" rx="4" fill="rgba(255,255,255,0.1)"/>
  <text x="290" y="145" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">NFT Name</text>
  <text x="290" y="160" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="8">1.2 ETH</text>
  
  <!-- Title -->
  <text x="200" y="210" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Ejoe NFT Marketplace</text>
  <text x="200" y="230" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="12">Discover, Collect & Sell NFTs</text>
</svg>
